# CI for the open-source repository.
# Documented in docs/ci.md — keep that file in sync with any change here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The public documentation site must always build; broken internal links
  # fail the build (onBrokenLinks: throw). Deployment happens separately in
  # docs.yml on merge to main.
  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  # Nothing in the open-source repository — code or documentation — may
  # reference the closed-source repository by name. The grep pattern below is
  # the only permitted occurrence of that name in this repository.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no references to the closed-source repository
        run: |
          if grep -rn "thinre-cloud" --include="*.go" --include="go.mod" --include="go.sum" --include="*.md" .; then
            echo "::error::repository references the closed-source repository"
            exit 1
          fi
          echo "boundary clean"
